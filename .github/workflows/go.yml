name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Inicia Banco
      run: docker compose up -d postgres

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12
        args: controllers/ database/ routes/ models/

    - name: Test
      run: DB_HOST=${{secrets.DB_HOST}} DB_PASSWORD=${{secrets.DB_PASSWORD}} DB_USER=${{secrets.DB_USER}} DB_NAME=${{secrets.DB_NAME}} DB_PORT=${{secrets.DB_PORT}} go test -v main_test.go
    
    - name: Build
      run: go build main.go

    - name: Projeto compilado
      uses: actions/upload-artifact@v7
      with:
        name: projeto_compilado
        path: main
